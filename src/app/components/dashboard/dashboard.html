<div class="container">

  <h1>Restaurant Dashboard</h1>

  <p>Welcome to Restaurant Reservation System</p>

  <div class="dashboard-grid">

    <div class="card">
      <h3>Total Tables</h3>
      <h1>{{ totalTables }}</h1>
    </div>

    <div class="card">
      <h3>Available Tables</h3>
      <h1>{{ availableTables }}</h1>
    </div>

    <div class="card">
      <h3>Booked Tables</h3>
      <h1>{{ bookedTables }}</h1>
    </div>

    <div class="card">
      <h3>Total Reservations</h3>
      <h1>{{ totalReservations }}</h1>
    </div>

  </div>

</div>
