<div class="container">

  <h1>Table Management</h1>

  <div class="summary">

    <h3>Available: {{ availableTables }}</h3>

    <h3>Booked: {{ bookedTables }}</h3>

  </div>

  <div class="table-grid">

    @for (table of tables; track table.id) {

      <div class="table-card"
           [class.available]="table.status === 'Available'"
           [class.booked]="table.status === 'Booked'">

        <h2>Table {{ table.id }}</h2>

        <p>Capacity: {{ table.capacity }} Persons</p>

        <h3>{{ table.status }}</h3>

        <button (click)="changeStatus(table.id)">
          Change Status
        </button>

      </div>

    }

  </div>

</div>
